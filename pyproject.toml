[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "services/ml_service/venv",
    "services/ml_service/.venv",
    "services/ml_service/__pycache__",
    "services/ml_service/models",
    "services/ml_service/logs",
    "services/ml_service/data",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
    "SIM",
    "C4",
    "ARG",
    "PTH",
    "RET",
    "TRY",
    "PERF",
    "RUF",
    "N",
    "S",
    "T20",
]
ignore = [
    "E501",
    "S101",
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"services/ml_service/tests/**/*.py" = ["ARG", "S101"]
"services/ml_service/train*.py" = ["T20"]
"services/ml_service/api/**/*.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["services/ml_service"]
exclude = [
    "services/ml_service/venv",
    "services/ml_service/.venv",
    "services/ml_service/__pycache__",
    "services/ml_service/models",
    "services/ml_service/logs",
    "services/ml_service/data",
]
reportMissingTypeStubs = "warning"

[tool.pytest.ini_options]
testpaths = ["services/ml_service/tests"]
addopts = "-q --tb=short"
asyncio_mode = "auto"

[tool.bandit]
exclude_dirs = [
    "services/ml_service/tests",
    "services/ml_service/venv",
    "services/ml_service/.venv",
]

[tool.deptry]
exclude = [
    "services/ml_service/venv",
    "services/ml_service/.venv",
    "services/ml_service/models",
    "services/ml_service/logs",
    "services/ml_service/data",
]

