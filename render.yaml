services:
  - type: keyvalue
    name: webwidgets-v1-queue
    plan: free
    region: virginia
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: 'off'

  - type: web
    name: webwidgets-v1-worker
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./services/sync-worker/Dockerfile
    dockerContext: ./services/sync-worker
    healthCheckPath: /ready
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: webwidgets-v1-queue
          property: connectionString
      - key: V1_QUEUES_ENABLED
        value: 'true'
      - key: WORKER_DRY_RUN
        value: 'false'
      - key: EMAIL_SYNC_ENABLED
        value: 'false'
      - key: PROVIDER_SYNC_ENABLED
        value: 'true'
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_TENANT_ID
        value: common
      - key: SCHEDULE_OWNER
        value: vercel
      - key: HEALTH_PORT
        value: '10000'
      - key: HEARTBEAT_INTERVAL_MS
        value: '30000'
      - key: JOB_TIMEOUT_MS
        value: '120000'
      - key: SHUTDOWN_TIMEOUT_MS
        value: '25000'
