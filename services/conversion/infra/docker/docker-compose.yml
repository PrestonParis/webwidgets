services:
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: conversion
      POSTGRES_PASSWORD: conversion
      POSTGRES_DB: conversion
    ports:
      - "5433:5432"
    volumes:
      - conversion-postgres:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conversion -d conversion"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - conversion-minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  createbucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/webwidgets-conversions;
      exit 0;
      "

  worker_images:
    build:
      context: ../..
      dockerfile: apps/worker-images/Dockerfile
    container_name: conversion_worker_images
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://conversion:conversion@postgres:5432/conversion
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: webwidgets-conversions
      S3_FORCE_PATH_STYLE: "true"
      IMAGE_WORKER_CONCURRENCY: 4
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker_docs:
    build:
      context: ../..
      dockerfile: apps/worker-docs/Dockerfile
    container_name: conversion_worker_docs
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://conversion:conversion@postgres:5432/conversion
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: webwidgets-conversions
      S3_FORCE_PATH_STYLE: "true"
      WORKER_CONCURRENCY: 2
      WORKER_LOCK_DURATION_MS: 300000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  sync_worker:
    profiles: [sync]
    build:
      context: ../../../..
      dockerfile: apps/sync-worker/Dockerfile
    container_name: sync_worker
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-common}
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-10}
      SYNC_BATCH_SIZE: ${SYNC_BATCH_SIZE:-50}
    depends_on:
      redis:
        condition: service_healthy

volumes:
  conversion-postgres:
  conversion-minio:
