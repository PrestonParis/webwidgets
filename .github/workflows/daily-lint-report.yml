name: Daily lint report

on:
  schedule:
    - cron: '0 23 * * *'
      timezone: 'America/New_York'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: daily-lint-report
  cancel-in-progress: false

jobs:
  publish:
    name: Check repository and publish report
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Run repository checks
        id: checks
        continue-on-error: true
        run: npm run check

      - name: Upload lint report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports-${{ github.run_id }}
          path: |
            reports/lint/latest.json
            reports/ts/latest.json
            reports/smells/latest.json
            reports/stats/latest.json
          if-no-files-found: warn
          retention-days: 14

      - name: Publish reports to Google Sheets
        env:
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
        run: npm run linting:publish-sheets

      - name: Preserve repository check status
        if: steps.checks.outcome == 'failure'
        run: |
          echo "Repository checks reported failures; the report was published."
          exit 1
