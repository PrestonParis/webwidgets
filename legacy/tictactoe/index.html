<!DOCTYPE html>

<head>
    <link rel="stylesheet" href="style.css">
    <title>Tic Tac Toe</title>
</head>

<body>
    <div class="info-grid">
        <div>
            <p id="result"></p>
        </div>
        <div>
            <p id="turn"></p>
        </div>
    </div>

    <div class="grid-container">
        <div class="square">
            <button class="one" onclick="placeLetter('one')"></button>
        </div>
        <div class="square">
            <button class="two" onclick="placeLetter('two')"></button>
        </div>
        <div class="square">
            <button class="three" onclick="placeLetter('three')"></button>
        </div>
        <div class="square">
            <button class="four" onclick="placeLetter('four')"></button>
        </div>
        <div class="square">
            <button class="five" onclick="placeLetter('five')"></button>
        </div>
        <div class="square">
            <button class="six" onclick="placeLetter('six')"></button>
        </div>
        <div class="square">
            <button class="seven" onclick="placeLetter('seven')"></button>
        </div>
        <div class="square">
            <button class="eight" onclick="placeLetter('eight')"></button>
        </div>
        <div class="square">
            <button class="nine" onclick="placeLetter('nine')"></button>
        </div>
    </div>
</body>

<script src="script.js"></script>
